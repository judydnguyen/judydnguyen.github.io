# Gallery Images
# You can use either:
#   - link/url: Full URL to an external image (e.g., "https://example.com/image.jpg")
#   - filename: Local filename relative to assets/img/ (e.g., "1.jpg")
# 
# IMPORTANT: For SharePoint/OneDrive images, you need a DIRECT image URL, not a sharing link!
# 
# How to get a direct image URL from SharePoint:
#   1. Open your SharePoint sharing link in a browser
#   2. Right-click on the image and select "Open image in new tab" OR
#   3. Click the three dots (⋯) menu → "Download" → Copy the download URL from browser address bar
#   4. The direct URL should look like: https://[tenant].sharepoint.com/.../_layouts/15/download.aspx?share=...
#   5. OR use an image hosting service like Imgur, Cloudinary, or GitHub Releases
# 
# Alternative: Upload to GitHub Releases or use Git LFS for large images
# 
# Images will be displayed in the order listed
images:
  # Example with external link:
  # - link: "https://example.com/your-image.jpg"
  #   caption: "Description of the image"
  # 
  # Example with SharePoint direct download link (NOT sharing link):
  # - link: "https://vanderbilt365-my.sharepoint.com/personal/.../_layouts/15/download.aspx?share=..."
  #   caption: "Description of the image"
  # 
  # Example with local file:
  # - filename: 1.jpg
  #   caption: "Description of the image"
  
